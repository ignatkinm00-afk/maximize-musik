services:
  - type: web
    name: maximize-musik-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@maximize.local
      - key: ADMIN_PASSWORD
        sync: false
      - key: WEB_URL
        value: https://ignatkinm00-afk.github.io/maximize-musik/
      - key: CORS_ORIGINS
        value: '*'
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: maximize-music
      - key: R2_PUBLIC_URL
        sync: false

plugins {
    id 'com.android.application'
}

def appVersionName = System.getenv('APP_VERSION_NAME') ?: '1.0.0'
def appVersionCode = (System.getenv('APP_VERSION_CODE') ?: '1').toInteger()

android {
    namespace 'com.maximize.musik'
    compileSdk 35

    defaultConfig {
        applicationId 'com.maximize.musik'
        minSdk 23
        targetSdk 35
        versionCode appVersionCode
        versionName appVersionName
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/*']
        }
    }
}

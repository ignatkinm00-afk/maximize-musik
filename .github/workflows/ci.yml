name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck API
        run: npm run typecheck --workspace @maximize/api

      - name: Typecheck web
        run: npm run typecheck --workspace @maximize/web

      - name: Build web
        env:
          VITE_API_URL: https://example.com
        run: npm run build

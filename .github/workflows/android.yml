name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Адрес API (https://…onrender.com). Пусто — задать в приложении'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$((GITHUB_RUN_NUMBER + 1))" >> "$GITHUB_OUTPUT"
          echo "APK version: $VERSION ($((GITHUB_RUN_NUMBER + 1)))"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build web
        env:
          VITE_BASE: ./
          VITE_API_URL: ${{ inputs.api_url || vars.VITE_API_URL }}
          VITE_APP_VERSION: ${{ steps.version.outputs.name }}
        run: npm run build

      - name: Prepare Android assets
        env:
          API_URL: ${{ inputs.api_url || vars.VITE_API_URL }}
        run: node tools/prepare-android.mjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK
        run: |
          set -e
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -sSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build APK
        env:
          APP_VERSION_NAME: ${{ steps.version.outputs.name }}
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: gradle -p apps/mobile/android assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist-apk
          cp apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk "dist-apk/Maximize-Musik-${{ steps.version.outputs.name }}.apk"
          ls -lh dist-apk

      - uses: actions/upload-artifact@v4
        with:
          name: maximize-musik-apk-${{ steps.version.outputs.name }}
          path: dist-apk/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Maximize Musik ${{ github.ref_name }}
          files: dist-apk/*.apk
          generate_release_notes: true
